name: Build Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compile translations
        shell: pwsh
        run: pyside6-lrelease translations/taiko_ja.ts

      # There is deliberately no "Run tests" step here. The Qt suite took
      # roughly five hours on the GitHub Windows runner, which made every
      # release a five-hour wait. Tests now run locally instead, in two
      # places, both of which fail loudly:
      #   * tools/run_tests.bat  -- run this before tagging a release
      #   * scripts/build_windows.bat -- step [6/9], aborts the build on failure
      # Do not tag a release from a tree where those have not passed.

      - name: Build portable Windows application
        run: pyinstaller --noconfirm --clean TaikoFancyArranger.spec

      - name: Add release documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/TaikoFancyArranger/README.md
          Copy-Item LICENSE dist/TaikoFancyArranger/LICENSE

          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $notes = "docs/releases/$tag.md"

            if (Test-Path $notes) {
              Copy-Item `
                $notes `
                dist/TaikoFancyArranger/RELEASE_NOTES.md
            }
          }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/TaikoFancyArranger/* `
            -DestinationPath TaikoFancyArranger-Windows-x64.zip `
            -Force

          $exe = Get-FileHash `
            dist/TaikoFancyArranger/TaikoFancyArranger.exe `
            -Algorithm SHA256

          $zip = Get-FileHash `
            TaikoFancyArranger-Windows-x64.zip `
            -Algorithm SHA256

          @(
            "$($exe.Hash)  TaikoFancyArranger.exe"
            "$($zip.Hash)  TaikoFancyArranger-Windows-x64.zip"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TaikoFancyArranger-Windows-x64
          path: |
            TaikoFancyArranger-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload assets to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            TaikoFancyArranger-Windows-x64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true