name: Build Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Compile translations
        shell: pwsh
        run: pyside6-lrelease translations/taiko_ja.ts

      # There is deliberately no "Run tests" step here. The Qt suite took
      # roughly five hours on the GitHub Windows runner, which made every
      # release a five-hour wait. Tests now run locally instead, in two
      # places, both of which fail loudly:
      #   * tools/run_tests.bat  -- run this before tagging a release
      #   * scripts/build_windows.bat -- step [6/9], aborts the build on failure
      # Do not tag a release from a tree where those have not passed.

      - name: Build portable Windows application
        run: pyinstaller --noconfirm --clean KatsuDonEditor.spec

      - name: Add release documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/KatsuDonEditor/README.md
          Copy-Item LICENSE dist/KatsuDonEditor/LICENSE

          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $notes = "docs/releases/$tag.md"

            if (Test-Path $notes) {
              Copy-Item `
                $notes `
                dist/KatsuDonEditor/RELEASE_NOTES.md
            }
          }

      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist/KatsuDonEditor/* `
            -DestinationPath KatsuDonEditor-Windows-x64.zip `
            -Force

          # The pre-rename asset, for v3.5.9 and earlier: their updater asks
          # for this zip and requires TaikoFancyArranger.exe inside it, so it
          # carries the same build with the exe under both names.
          Copy-Item -Recurse dist/KatsuDonEditor legacy
          Copy-Item legacy/KatsuDonEditor.exe legacy/TaikoFancyArranger.exe
          Compress-Archive `
            -Path legacy/* `
            -DestinationPath TaikoFancyArranger-Windows-x64.zip `
            -Force

          $exe = Get-FileHash `
            dist/KatsuDonEditor/KatsuDonEditor.exe `
            -Algorithm SHA256

          $zip = Get-FileHash `
            KatsuDonEditor-Windows-x64.zip `
            -Algorithm SHA256

          $legacy = Get-FileHash `
            TaikoFancyArranger-Windows-x64.zip `
            -Algorithm SHA256

          @(
            "$($exe.Hash)  KatsuDonEditor.exe"
            "$($zip.Hash)  KatsuDonEditor-Windows-x64.zip"
            "$($legacy.Hash)  TaikoFancyArranger-Windows-x64.zip"
          ) | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KatsuDonEditor-Windows-x64
          path: |
            KatsuDonEditor-Windows-x64.zip
            TaikoFancyArranger-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload assets to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            KatsuDonEditor-Windows-x64.zip
            TaikoFancyArranger-Windows-x64.zip
            SHA256SUMS.txt
          fail_on_unmatched_files: true